<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Student Record Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Update Student Record</h1>
        <p>Edit the student's information below.</p>

        <form method="POST">

            <label>Student ID</label>
            <input type="text" value="{{ student.student_id }}" disabled>

            <label>Full Name</label>
            <input type="text" name="full_name"
                   value="{{ student.full_name }}" required>

            <label>Course</label>
            <input type="text" name="course"
                   value="{{ student.course }}" required>

            <label>Year Level</label>
            <input type="number" name="year_level"
                   value="{{ student.year_level }}"
                   min="1" max="6" required>

            <button type="submit">Save Changes</button>

        </form>

        <a href="{{ url_for('home') }}">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
